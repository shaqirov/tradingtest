---
x-freqtrade: &freqtrade
  image: freqtradeorg/freqtrade:stable
  restart: unless-stopped
  volumes:
    - "./user_data:/freqtrade/user_data"
  env_file:
    - .env

services:
  # Bot 1: own strategy, FreqUI on http://127.0.0.1:8080
  freqtrade:
    <<: *freqtrade
    container_name: freqtrade
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy EmaRsiTrendStrategy

  # Bot 2: NostalgiaForInfinityX7, FreqUI on http://127.0.0.1:8081
  freqtrade-nfi:
    <<: *freqtrade
    container_name: freqtrade-nfi
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      FREQTRADE__BOT_NAME: nfi
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-nfi.log
      --db-url sqlite:////freqtrade/user_data/tradesv3-nfi.sqlite
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config-nfi.json
      --strategy NostalgiaForInfinityX7
